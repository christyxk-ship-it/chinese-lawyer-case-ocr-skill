name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base dependencies
        run: python -m pip install --requirement requirements-base.txt
      - name: Python syntax
        run: python -c 'import ast,pathlib; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in pathlib.Path(".").rglob("*.py")]'
      - name: Shell syntax
        run: bash -n install.sh
      - name: Tests
        run: python -m unittest discover -s tests -v
