name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Base dependencies
        run: python -m pip install --requirement requirements-base.txt
      - name: Python syntax
        run: python -c 'import ast,pathlib; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in pathlib.Path(".").rglob("*.py")]'
      - name: Shell syntax
        run: bash -n install.sh
      - name: Tests
        run: python -m unittest discover -s tests -v
